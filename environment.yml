name: metagenome_assembly
channels:
  - conda-forge
  - bioconda
channel_priority: strict ## 优先使用channels中指定的channel；避开默认channel带来的商业冲突
dependencies:
  - snakemake
  - python>=3.11
  - samtools>=1.14
  - bcftools>=1.14
  - fastp
  - pygraphviz
  - paralleltask
  - matplotlib
  - biopython
  - python-edlib
  - networkx>=2.6,<3.4
  - gfapy
  - karateclub
  - numpy>=1.24,<1.27
  - pandas>=1.3,<3
  - pysam>=0.20,<0.23
  - scipy>=1.8,<1.13
  - minimap2>=2.2
  - strainy
  - flye>=2.9
  - myloasm >=0.5
  - nextpolish >=1.4.1
  - seqtk
  - seqkit
  - barrnap
  - semibin >= 2.2
  - checkm2 ## 组装后评估
  - pyani >= 0.2,<0.3
  - chopper # NanoFilt + NanoLyse的rust实现，
  - genomad==1.11.0
  - checkv==1.0.1
  - infernal==1.1.5
  - quast>=5.2.0
  - skani >= 0.3
  - sylph >= 0.8.1
  - pigz >= 2.8
  - megahit >=1.2.9
  - bowtie2 >=2.5.0
